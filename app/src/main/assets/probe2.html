<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#111;color:#0f0;font:12px monospace;margin:6px;white-space:pre-wrap}</style>
</head><body><div id="out">booting…</div>
<script src="l2d/live2dcubismcore.min.js"></script>
<script>
var lines=[];
function log(s){lines.push(s);document.getElementById('out').textContent=lines.join("\n");window.__probeText=lines.join(" | ");try{Native.emit(s);}catch(e){}}
function done(tag){window.__done=tag;document.title=tag;try{Native.emit("PROBE_DONE="+tag);}catch(e){}}
window.onerror=function(m,src,l,c,err){log("WINDOW_ONERROR "+m+" @"+l+":"+c);done("JS_ERROR");};

function xhrBuf(url){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open('GET',url,true); x.responseType='arraybuffer';
    x.onload=function(){ if(x.status===200||x.status===0) res(x.response); else rej('status '+x.status); };
    x.onerror=function(){ rej('xhr error'); };
    x.send();
  });
}

setTimeout(async function(){
  try{
    log("--- CUBISM CORE ---");
    if(typeof Live2DCubismCore==='undefined'){ log("Core=UNDEFINED (script did not define global)"); done("CORE_MISSING"); return; }
    log("Core=PRESENT");
    var V=Live2DCubismCore.Version;
    log("csmGetVersion="+V.csmGetVersion());
    log("csmGetLatestMocVersion="+V.csmGetLatestMocVersion());
    if(V.csmHasMocConsistency) log("hasMocConsistency="+(typeof V.csmHasMocConsistency));

    log("--- LOAD MOC3 ---");
    var buf=await xhrBuf('l2d/test.moc3');
    log("moc3 bytes="+buf.byteLength);
    var u8=new Uint8Array(buf);
    log("magic="+String.fromCharCode(u8[0],u8[1],u8[2],u8[3])+" ver="+u8[4]);

    var proc=Live2DCubismCore.Moc.fromArrayBuffer(buf);
    log("Moc.fromArrayBuffer="+(proc?"OK":"NULL"));
    if(!proc){ done("MOC_PARSE_FAIL"); return; }

    var model=Live2DCubismCore.Model.fromMoc(proc);
    log("Model.fromMoc="+(model?"OK":"NULL"));
    if(!model){ done("MODEL_FAIL"); return; }

    var c=model.canvasinfo;
    log("canvas="+c.CanvasWidth+"x"+c.CanvasHeight+" origin="+c.CanvasOriginX+","+c.CanvasOriginY+" ppu="+c.PixelsPerUnit);
    model.update();
    var ps=model.parameters;
    log("paramCount="+ps.count+" values="+ps.values.length+" min="+ps.minimumValues.length);
    log("drawableCount="+model.drawables.count);
    log("partCount="+model.parts.count);
    var ids=[]; for(var i=0;i<Math.min(6,ps.count);i++) ids.push(ps.ids[i]);
    log("firstParams="+ids.join(","));

    // find key params
    var want={}, idx=function(n){ for(var i=0;i<ps.count;i++) if(ps.ids[i]===n) return i; return -1; };
    ['ParamEyeLOpen','ParamMouthOpenY','ParamAngleX','ParamBreath'].forEach(function(n){
      log("idx("+n+")="+idx(n));
    });
    done("MOC_OK");
  }catch(e){
    log("FATAL "+e+(e&&e.stack?"\n"+e.stack:""));
    done("FATAL");
  }
},300);
</script>
</body></html>
