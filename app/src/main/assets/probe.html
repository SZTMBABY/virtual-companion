<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#111;color:#0f0;font:13px monospace;margin:6px;white-space:pre-wrap}</style>
</head><body><div id="out">booting…</div>
<canvas id="c" width="256" height="256" style="display:none"></canvas>
<script>
var lines=[];
function log(s){lines.push(s);document.getElementById('out').textContent=lines.join("\n");window.__probeText=lines.join(" | ");try{Native.emit(s);}catch(e){}}
try{
  log("UA="+navigator.userAgent);
  log("dpr="+window.devicePixelRatio+" screen="+screen.width+"x"+screen.height);
  var c=document.getElementById('c');
  var gl2=c.getContext('webgl2');
  var gl=gl2||c.getContext('webgl')||c.getContext('experimental-webgl');
  log("webgl2="+(gl2?"YES":"NO")+" webgl1="+(gl?"YES":"NO"));
  if(gl){
    var dbg=gl.getExtension('WEBGL_debug_renderer_info');
    log("VENDOR="+(dbg?gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR)));
    log("RENDERER="+(dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)));
    log("VERSION="+gl.getParameter(gl.VERSION));
    log("MAX_TEXTURE="+gl.getParameter(gl.MAX_TEXTURE_SIZE));
    log("MAX_VIEWPORT="+gl.getParameter(gl.MAX_VIEWPORT_DIMS));
    log("isWebGL2API="+(typeof WebGL2RenderingContext!=='undefined'));
    if(gl2){
      log("MAX_SAMPLES="+gl2.getParameter(gl2.MAX_SAMPLES));
      log("MAX_UNIFORM_BLOCK="+gl2.getParameter(gl2.MAX_UNIFORM_BLOCK_SIZE));
    }
  }
  // wasm support
  try{ log("wasm="+(typeof WebAssembly==='object'?"YES":"NO")); }catch(e){ log("wasm=ERR "+e); }
  try{ var m=new WebAssembly.Module(new Uint8Array([0,97,115,109,1,0,0,0])); log("wasm.compile=OK"); }catch(e){ log("wasm.compile=ERR "+e); }
  try{ log("BigInt64="+(typeof BigInt64Array)); }catch(e){}
  // canvas2d
  var c2=document.createElement('canvas').getContext('2d');
  log("canvas2d="+(c2?"YES":"NO"));
  // measure draw perf at 640x480 clear
  var c3=document.getElementById('c');
  var g3=c3.getContext('webgl2')||c3.getContext('webgl');
  if(g3){
    g3.clearColor(0.1,0.2,0.3,1);
    var t0=performance.now(), n=0;
    while(performance.now()-t0<500){ g3.clear(g3.COLOR_BUFFER_BIT); g3.finish(); n++; }
    log("clear_loop_fps="+Math.round(n/((performance.now()-t0)/1000)));
  }
  log("DONE");
}catch(e){ log("FATAL "+e); document.title="PROBE_ERR"; }
document.title="PROBE_OK";
</script>
</body></html>
