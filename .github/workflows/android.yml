name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Do NOT use android-actions/setup-android here: it calls
      # `sdkmanager --install tools`, a package that no longer exists in
      # cmdline-tools 20+, so the step aborts before doing anything useful.
      # The ubuntu runner image already ships an Android SDK; just top it up.
      - name: Android SDK packages
        run: |
          set -x
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk 37: the package id is versioned ("android-37.0") on the new
          # SDK versioning scheme; try both spellings and let AGP report if neither lands.
          for pkg in "platforms;android-37.0" "platforms;android-37" "build-tools;37.0.0"; do
            "$SDKMANAGER" --install "$pkg" || true
          done
          ls "$ANDROID_HOME/platforms" || true

      # Large binaries are not in git; the script verifies every sha256.
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('tools/models.sha256') }}

      - name: Fetch models and native libraries
        run: bash tools/fetch_models.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
